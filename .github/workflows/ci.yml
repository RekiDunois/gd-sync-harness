name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install rclone (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Install rclone (macOS)
        if: runner.os == 'macOS'
        run: brew install rclone

      - name: Show tool versions
        run: |
          go version
          rclone version

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build CLI
        shell: bash
        run: |
          set -euo pipefail
          CLI_BIN="$RUNNER_TEMP/knowledge-sync"
          go build -trimpath -o "$CLI_BIN" ./cmd/knowledge-sync
          test -x "$CLI_BIN"
          go version -m "$CLI_BIN"
          echo "CLI_BIN=$CLI_BIN" >> "$GITHUB_ENV"

      - name: Smoke-test built CLI
        shell: bash
        run: |
          set -euo pipefail
          "$CLI_BIN" --version
          "$CLI_BIN" --help >/dev/null
          "$CLI_BIN" profile --help >/dev/null
          "$CLI_BIN" profile prune --help >/dev/null

      - name: Test full suite
        run: go test -count=1 ./...

      - name: Verify tests leave checkout clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
