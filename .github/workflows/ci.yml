name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install rclone (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Install rclone (macOS)
        if: runner.os == 'macOS'
        run: brew install rclone

      - name: Show tool versions
        run: |
          go version
          rclone version

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build CLI
        shell: bash
        run: |
          set -euo pipefail
          CLI_BIN="$RUNNER_TEMP/knowledge-sync"
          go build -trimpath -o "$CLI_BIN" ./cmd/knowledge-sync
          test -x "$CLI_BIN"
          go version -m "$CLI_BIN"
          echo "CLI_BIN=$CLI_BIN" >> "$GITHUB_ENV"

      - name: Smoke-test built CLI
        shell: bash
        run: |
          set -euo pipefail
          "$CLI_BIN" --version
          "$CLI_BIN" --help >/dev/null
          "$CLI_BIN" profile --help >/dev/null
          "$CLI_BIN" profile prune --help >/dev/null

      - name: Test full suite
        run: go test -count=1 ./...

      - name: Verify tests leave checkout clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  coverage:
    name: coverage
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Package-local coverage
        run: go test -count=1 -coverprofile=coverage-package.out ./...

      - name: Cross-package coverage
        run: go test -count=1 -coverpkg=./... -coverprofile=coverage-cross.out ./...

      - name: Enforce coverage gates
        shell: bash
        run: |
          set -euo pipefail
          total="$(go tool cover -func=coverage-cross.out | awk '$1 == "total:" {gsub("%", "", $3); print $3}')"
          # Start with the documented Phase 4 gate; raise this to 70% after
          # two stable CI iterations without weakening the package floors.
          awk -v actual="$total" 'BEGIN { if (actual < 65) { printf "cross-package coverage %.1f%% is below 65%%\n", actual; exit 1 } }'
          for package in internal/state internal/sync internal/remote internal/sidecar; do
            profile="coverage-${package##*/}.out"
            go test -count=1 -coverprofile="$profile" "./$package"
            floor="$(go tool cover -func="$profile" | awk '$1 == "total:" {gsub("%", "", $3); print $3}')"
            awk -v name="$package" -v actual="$floor" 'BEGIN { if (actual < 60) { printf "%s coverage %.1f%% is below 60%%\n", name, actual; exit 1 } }'
          done
          printf 'coverage gates: cross-package %.1f%%, safety package floors >= 60%%\n' "$total"

      - name: Publication audit regression tests
        shell: bash
        run: sh scripts/publication-audit_test.sh

      - name: Render coverage summaries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Go coverage'
            for profile in coverage-package coverage-cross; do
              summary="${profile}.txt"
              echo "### ${profile}"
              if [[ -f "${profile}.out" ]]; then
                go tool cover -func="${profile}.out" | tee "${summary}"
                echo '```text'
                cat "${summary}"
                echo '```'
              else
                printf '%s\n' 'Profile was not generated.' | tee "${summary}"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage-package.out
            coverage-package.txt
            coverage-cross.out
            coverage-cross.txt
          if-no-files-found: warn

  race:
    name: race (push)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Race test suite
        run: go test -race ./...
